[package]
name = "tab-hash"
version = "0.4.0"
authors = ["Henning Timm <henning.timm@tu-dortmund.de>", "Jianshu Zhao <jianshuzhao@yahoo.com>"]
description = "Simple, twisted, and mixed tabulation hashing for 32-bit and 64-bit unsigned integers."
homepage = "https://github.com/HenningTimm/rust-tab-hash"
repository = "https://github.com/HenningTimm/rust-tab-hash"
documentation = "https://docs.rs/tab-hash"
build = "build.rs"
readme = "README.md"
license = "MIT"
edition = "2024"
keywords = ["hash", "hashing"]

[badges]
travis-ci = { repository = "HenningTimm/rust-tab-hash" }

[dependencies]
rand = "0.10"
array-init = "2.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
bincode = "1.3.3, <2.0.0"

[build-dependencies]
cc = "1.0.46"
